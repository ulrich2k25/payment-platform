services:
  postgres:
    image: postgres:16
    container_name: payment_platform_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment_dev_password
      POSTGRES_DB: payment_platform
    ports:
      - "5435:5432"
    volumes:
      - payment_platform_data:/var/lib/postgresql/data

volumes:
  payment_platform_data:
